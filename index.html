<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Демо CRM: воронки продаж, лиды от физлиц, imBox, отчёты по рекламным кампаниям">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<title>CRM Заявки и кампании</title>
<style>
/* Интерфейс в стиле amoCRM: тёмное боковое меню-рейка, светлая рабочая область,
   канбан-воронка с цветными этапами. */
:root {
  --rail: #1f2d3d;
  --rail-hover: #2b3d51;
  --rail-text: #b6c2d1;
  --accent: #2a78d6;
  --accent-soft: #e4eefb;
  --bg: #edeff3;
  --surface: #ffffff;
  --surface-muted: #f5f7fa;
  --column: #e6eaf0;
  --border: #dde2ea;
  --text: #1b2733;
  --text-muted: #6b7a8d;
  --green: #1a9e4b;
  --red: #d03b3b;
  --amber: #d97706;
  --radius: 4px;
  --shadow: 0 1px 2px rgba(27, 39, 51, .08);
  --shadow-lg: 0 8px 28px rgba(27, 39, 51, .18);

  /* Слоты категориальной палитры графиков (светлая тема). */
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;
  --grid: #e6e9ef;
  --axis: #c3c9d4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
}

button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
h1, h2, h3 { margin: 0; }
.app-loading { padding: 40px; color: var(--text-muted); }

/* ---------- Каркас ---------- */
.layout { display: grid; grid-template-columns: 78px 1fr; min-height: 100vh; }

.rail {
  background: var(--rail);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 10px 8px;
  gap: 2px;
}
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail .logo {
  color: #fff; font-weight: 700; font-size: 15px; letter-spacing: .5px;
  text-align: center; padding: 8px 0 16px;
}
.rail a {
  color: var(--rail-text); border-radius: var(--radius); padding: 9px 4px;
  display: grid; justify-items: center; gap: 4px; font-size: 10px; text-align: center; line-height: 1.2;
}
.rail a .ico { font-size: 17px; line-height: 1; }
.rail a:hover { background: var(--rail-hover); color: #fff; }
.rail a.active { background: var(--accent); color: #fff; }
.rail .spacer { flex: 1; }
.rail .me {
  color: var(--rail-text); text-align: center; font-size: 10px;
  border-top: 1px solid rgba(255, 255, 255, .12); padding-top: 10px;
}
.rail .me .avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff;
  display: grid; place-items: center; margin: 0 auto 6px; font-size: 12px; font-weight: 600;
}
.rail .me button {
  margin-top: 8px; width: 100%; background: transparent; color: var(--rail-text);
  border: 1px solid rgba(255, 255, 255, .2); border-radius: var(--radius); padding: 4px; cursor: pointer;
}
.rail .me button:hover { background: var(--rail-hover); color: #fff; }

.workspace { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 20px; min-height: 52px; display: flex; align-items: center;
  justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.topbar h1 { font-size: 17px; font-weight: 600; }
.topbar .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.content { padding: 16px 20px 40px; min-width: 0; flex: 1; }

/* ---------- Элементы ---------- */
.btn {
  background: var(--accent); color: #fff; border: 1px solid transparent;
  border-radius: var(--radius); padding: 7px 14px; cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn.secondary:hover { background: var(--surface-muted); filter: none; }
.btn.danger { background: var(--red); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-muted); padding: 4px 7px; }
.btn.ghost:hover { background: var(--surface-muted); color: var(--text); }
.btn.chip {
  background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
  border-radius: 999px; padding: 5px 12px; font-weight: 400;
}
.btn.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

input, select, textarea {
  width: 100%; padding: 7px 9px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface); outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="date"] { width: auto; }
.search { width: 230px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-head {
  padding: 12px 14px; border-bottom: 1px solid var(--border); font-weight: 600;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.card-body { padding: 14px; }
/* Широкие таблицы прокручиваются внутри карточки, а не тянут страницу вбок. */
.table-wrap { overflow-x: auto; }

.grid { display: grid; gap: 12px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.cols-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }

/* Колонка блоков страницы: minmax(0, 1fr) не даёт широкому графику растянуть страницу. */
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }

.stat .label { color: var(--text-muted); font-size: 12px; }
.stat .value { font-size: 23px; font-weight: 700; margin-top: 4px; }
.stat .hint { color: var(--text-muted); font-size: 11px; margin-top: 3px; }
.stat.good .value { color: var(--green); }
.stat.bad .value { color: var(--red); }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); }
th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--surface-muted); }
td.actions { text-align: right; white-space: nowrap; }
tfoot td { font-weight: 600; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: var(--surface-muted); border: 1px solid var(--border); }
.badge.prio-high { background: #fdeaea; border-color: #f6c9c9; color: #a12727; }
.badge.prio-low { color: var(--text-muted); }
.muted { color: var(--text-muted); }
.overdue { color: var(--red); font-weight: 600; }
.empty { padding: 26px; text-align: center; color: var(--text-muted); }

/* Хэштег рекламной кампании */
.tag {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; background: var(--surface-muted); border: 1px solid var(--border); color: var(--text);
}
.tag .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tag.removable { cursor: pointer; }
.tag-list { display: flex; flex-wrap: wrap; gap: 5px; }

/* ---------- Канбан ---------- */
.board { min-height: 62vh; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(216px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 10px; }
.column { background: var(--column); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 200px; }
.column > header { padding: 8px 10px 10px; border-top: 3px solid var(--stage-color, var(--accent)); border-radius: var(--radius) var(--radius) 0 0; }
.column > header .title { font-weight: 600; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
.column > header .sum { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.column .items { padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.column.drop-target { outline: 2px dashed var(--accent); outline-offset: -3px; }

.deal-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 9px 10px; cursor: grab; box-shadow: var(--shadow);
}
.deal-card:active { cursor: grabbing; }
.deal-card.dragging { opacity: .45; }
.deal-card .title { font-weight: 600; margin-bottom: 3px; line-height: 1.3; }
.deal-card .who { color: var(--text-muted); font-size: 11px; }
.deal-card .amount { font-weight: 600; margin-top: 5px; }
.deal-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }
.deal-card .owner {
  width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-size: 10px; font-weight: 600; flex: none;
}

/* ---------- Модальные окна ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(27, 39, 51, .45);
  display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow-y: auto;
}
.modal { background: var(--surface); border-radius: var(--radius); width: min(640px, 100%); box-shadow: var(--shadow-lg); }
.modal.wide { width: min(880px, 100%); }
.modal header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal header h2 { font-size: 16px; }
.modal .body { padding: 18px; display: grid; gap: 14px; }
.modal footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.field label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted); }
.field .error { color: var(--red); font-size: 11px; margin-top: 3px; }
.fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.section-title { font-weight: 600; margin-bottom: 8px; }

/* ---------- Вход ---------- */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--rail); }
.login { width: min(370px, 100%); }
.login h1 { font-size: 19px; margin-bottom: 4px; }
.login .hint { color: var(--text-muted); font-size: 12px; margin-bottom: 16px; }
.login form { display: grid; gap: 13px; }

/* ---------- Уведомления ---------- */
.toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
.toast { background: #1f2d3d; color: #fff; padding: 9px 15px; border-radius: var(--radius); box-shadow: var(--shadow-lg); }
.toast.error { background: var(--red); }

/* ---------- Лента активности ---------- */
.timeline { display: flex; flex-direction: column; gap: 11px; }
.timeline .item { display: flex; gap: 9px; }
.timeline .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 5px; flex: none; }
.timeline .item.system .dot { background: var(--text-muted); }
.timeline .meta { color: var(--text-muted); font-size: 11px; }

/* ---------- Аналитика ---------- */
.filters { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.filters .field { min-width: 130px; }
.filters .field label { font-size: 11px; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }

.chart-wrap { position: relative; overflow-x: auto; }
.chart { width: 100%; min-width: 560px; display: block; }
.chart .grid-line { stroke: var(--grid); stroke-width: 1; }
.chart .axis-line { stroke: var(--axis); stroke-width: 1; }
.chart text { fill: var(--text-muted); font-size: 10px; }
.chart .col-hit { fill: transparent; }
.chart .col-hit:hover ~ .col-bg, .chart .col-bg.hover { fill: var(--surface-muted); }
.chart .value-label { fill: var(--text); font-size: 10px; font-weight: 600; }

.chart-tooltip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 8px 10px; font-size: 12px;
  min-width: 150px; z-index: 5;
}
.chart-tooltip .head { font-weight: 600; margin-bottom: 5px; }
.chart-tooltip .row { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.chart-tooltip .row .name { display: flex; align-items: center; gap: 6px; }
.chart-tooltip .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
.legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.legend .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .rail { flex-direction: row; align-items: center; overflow-x: auto; padding: 6px; }
  .rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail .logo { padding: 0 10px; }
  .rail .me { border: none; padding: 0 8px; display: flex; align-items: center; gap: 8px; }
  .rail .me .avatar { margin: 0; }
  .rail .me button { width: auto; }
  .grid.cols-4, .grid.cols-3, .grid.cols-2, .grid.cols-6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .content { padding: 12px; }
  .fields-row { grid-template-columns: 1fr; }
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --rail: #0b1421;
    --rail-hover: #1b2838;
    --rail-text: #9fb0c4;
    --accent: #3987e5;
    --accent-soft: #1b3660;
    --bg: #0b1220;
    --surface: #111a2e;
    --surface-muted: #16223c;
    --column: #15203a;
    --border: #243350;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-lg: 0 10px 30px rgba(0, 0, 0, .5);

    /* Те же восемь оттенков, подобранные под тёмную поверхность. */
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    --grid: #1e2b45;
    --axis: #2f3f5e;
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .badge.prio-high { background: #3b1414; border-color: #6d2626; color: #f7b2b2; }
  :root:not([data-theme="light"]) .toast { background: #1b2838; }
}

/* Явно выбранная тёмная тема — те же значения, что и в медиазапросе выше. */
:root[data-theme="dark"] {
  --rail: #0b1421;
  --rail-hover: #1b2838;
  --rail-text: #9fb0c4;
  --accent: #3987e5;
  --accent-soft: #1b3660;
  --bg: #0b1220;
  --surface: #111a2e;
  --surface-muted: #16223c;
  --column: #15203a;
  --border: #243350;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-lg: 0 10px 30px rgba(0, 0, 0, .5);

  /* Те же восемь оттенков, подобранные под тёмную поверхность. */
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  --grid: #1e2b45;
  --axis: #2f3f5e;
  color-scheme: dark;
}
:root[data-theme="dark"] .badge.prio-high { background: #3b1414; border-color: #6d2626; color: #f7b2b2; }
:root[data-theme="dark"] .toast { background: #1b2838; }

/* Канбан задач: карточки такие же лёгкие, как в воронке сделок. */
.task-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 9px 10px; box-shadow: var(--shadow); display: grid; gap: 6px;
}
.task-card .title { font-weight: 600; cursor: pointer; }
.task-card .title:hover { color: var(--accent); }
.task-card .who { color: var(--text-muted); font-size: 11px; }
.task-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.task-card .owner {
  width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-size: 10px; font-weight: 600; flex: none;
}

/* Выбор воронки в шапке раздела «Сделки». */
.pipeline-select {
  width: auto; min-width: 190px; font-size: 15px; font-weight: 600;
  border-color: transparent; background: transparent; padding-left: 0;
}
.pipeline-select:hover { border-color: var(--border); background: var(--surface); }

/* Анализ продаж: этапы воронки колонками с долей сделок. */
.funnel { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 10px; overflow-x: auto; }
.funnel-stage {
  border-top: 3px solid var(--stage-color, var(--accent));
  background: var(--surface-muted); border-radius: var(--radius); padding: 10px;
  display: grid; gap: 4px; align-content: start;
}
.funnel-stage .name { font-weight: 600; font-size: 12px; }
.funnel-stage .count { font-size: 18px; font-weight: 700; }
.funnel-stage .sum { font-size: 11px; }
.funnel-stage .bar { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.funnel-stage .fill { height: 100%; background: var(--stage-color, var(--accent)); border-radius: 999px; }

/* ---------- imBox: переписки с клиентами ---------- */
.chat-layout {
  display: grid; grid-template-columns: 300px 1fr; gap: 12px;
  height: calc(100vh - 140px); min-height: 420px;
}
.chat-list {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow-y: auto; box-shadow: var(--shadow);
}
.chat-item {
  display: flex; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
}
.chat-item:hover { background: var(--surface-muted); }
.chat-item.active { background: var(--accent-soft); }
.chat-item .avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none;
}
.chat-item .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.chat-item .preview {
  font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.badge.unread { background: var(--accent); border-color: var(--accent); color: #fff; }

.chat-pane {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow);
}
.chat-head {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.chat-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.bubble {
  max-width: min(520px, 80%); padding: 8px 11px; border-radius: 10px;
  background: var(--surface-muted); border: 1px solid var(--border);
}
.bubble.out { align-self: flex-end; background: var(--accent-soft); border-color: var(--accent-soft); }
.bubble .meta { color: var(--text-muted); font-size: 10px; margin-top: 4px; }
.chat-form {
  border-top: 1px solid var(--border); padding: 10px 12px;
  display: grid; grid-template-columns: 1fr 140px; gap: 8px;
}

@media (max-width: 900px) {
  .chat-layout { grid-template-columns: 1fr; height: auto; }
  .chat-list { max-height: 240px; }
  .chat-pane { min-height: 420px; }
  .chat-form { grid-template-columns: 1fr; }
}


/* Демо-витрина живёт внутри страницы, поэтому высота считается от неё, а не от окна. */
html, body { height: 100%; }
body { margin: 0; }
.layout { min-height: 100%; }

.demo-note {
  position: fixed;
  left: 0;
  bottom: 0;
  z-index: 60;
  margin: 0 0 env(safe-area-inset-bottom, 0px) 0;
  padding: 6px 12px;
  background: var(--rail);
  color: var(--rail-text);
  border-top-right-radius: var(--radius);
  font-size: 11px;
  line-height: 1.35;
  max-width: min(320px, 70vw);
}
.demo-note b { color: #fff; font-weight: 600; }

@media (max-width: 900px) {
  .demo-note { font-size: 10px; padding: 5px 9px; }
}
</style>
</head>
<body>
<div id="app" class="app-loading">Загрузка…</div>
